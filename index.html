<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>nely luv emilly</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }

        /* Canvas da neve cobrindo toda a tela */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Container principal centralizado e adaptável */
        .couple-container {
            position: relative;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 500px;
            padding: 0 10px;
        }

        /* Bonecos com proporção para telemóvel */
        .character {
            width: 38vw;
            max-width: 190px;
            height: auto;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.25));
            flex-shrink: 0;
        }

        /* Linha reta conectando os dois bonecos */
        .connection-line {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 24vw;
            max-width: 120px;
            margin: 0 -10px; /* Ajuste para encostar nos bonecos */
        }

        .connection-line::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 2px;
            background-color: #ffffff; /* Linha reta branca contínua */
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
            z-index: 1;
        }

        /* Coração branco sobre a linha reta */
        .heart {
            position: relative;
            z-index: 2;
            color: #ffffff;
            font-size: 20px;
            background-color: #000000;
            padding: 0 6px;
            border-radius: 50%;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.9);
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.3);
            }
        }

        /* Player de áudio centralizado na parte inferior */
        .audio-container {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            opacity: 0.85;
            transition: opacity 0.3s ease;
        }

        .audio-container:hover {
            opacity: 1;
        }

        audio {
            height: 35px;
            width: 260px;
            max-width: 85vw;
        }
    </style>
</head>
<body>

    <!-- Fundo de neve -->
    <canvas id="snowCanvas"></canvas>

    <!-- Estrutura central -->
    <div class="couple-container">
        <!-- Rapaz -->
        <img src="boy.png" alt="Personagem Masculino" class="character">
        
        <!-- Linha Reta de Conexão com Coração -->
        <div class="connection-line">
            <span class="heart">♥</span>
        </div>
        
        <!-- Rapariga -->
        <img src="girl.png" alt="Personagem Feminino" class="character">
    </div>

    <!-- Player de música -->
    <div class="audio-container">
        <audio id="bgMusic" src="music.mp3" autoplay loop controls></audio>
    </div>

    <script>
        const canvas = document.getElementById('snowCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Flocos de neve otimizados para telemóvel
        const snowflakes = [];
        const maxSnowflakes = 80;

        for (let i = 0; i < maxSnowflakes; i++) {
            snowflakes.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 3 + 1,
                speed: Math.random() * 1.5 + 0.5,
                wind: Math.random() * 0.5 - 0.25,
                opacity: Math.random() * 0.7 + 0.3
            });
        }

        function drawSnow() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';

            for (let flake of snowflakes) {
                ctx.globalAlpha = flake.opacity;
                ctx.beginPath();
                ctx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2, true);
                ctx.fill();

                flake.y += flake.speed;
                flake.x += flake.wind;

                if (flake.y > canvas.height) {
                    flake.y = -10;
                    flake.x = Math.random() * canvas.width;
                }

                if (flake.x > canvas.width || flake.x < 0) {
                    flake.x = Math.random() * canvas.width;
                }
            }

            requestAnimationFrame(drawSnow);
        }

        drawSnow();
    </script>
</body>
</html>
