<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nely luv emilly</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }

        /* Canvas da neve cobrindo toda a tela */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Container centralizado para os dois bonecos */
        .couple-container {
            position: relative;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
        }

        /* Bonecos maiores com visualização nítida em pixel art */
        .character {
            width: 220px;
            height: auto;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.25));
        }

        /* Container da conexão curvada */
        .connection-wrapper {
            position: relative;
            width: 180px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* SVG para desenhar a linha curvada em arco */
        .curved-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .curved-line {
            fill: none;
            stroke: #ffffff;
            stroke-width: 3;
            stroke-linecap: round;
            filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.8));
        }

        /* Coração branco no topo do arco */
        .heart {
            position: absolute;
            top: 10px;
            z-index: 2;
            color: #ffffff;
            font-size: 30px;
            background-color: #000000;
            padding: 0 8px;
            border-radius: 50%;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.3);
            }
        }

        /* Estilização para o player de áudio */
        .audio-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10;
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }

        .audio-container:hover {
            opacity: 1;
        }

        audio {
            height: 35px;
            width: 240px;
        }
    </style>
</head>
<body>

    <!-- Fundo de neve -->
    <canvas id="snowCanvas"></canvas>

    <!-- Bonequinhos centralizados -->
    <div class="couple-container">
        <!-- Foto do rapaz -->
        <img src="boy.png" alt="Personagem Masculino" class="character">
        
        <!-- Linha curvada e coração -->
        <div class="connection-wrapper">
            <svg class="curved-svg" viewBox="0 0 180 100">
                <path d="M 10,80 Q 90,-10 170,80" class="curved-line" />
            </svg>
            <span class="heart">♥</span>
        </div>
        
        <!-- Foto da moça -->
        <img src="girl.png" alt="Personagem Feminino" class="character">
    </div>

    <!-- Player de música -->
    <div class="audio-container">
        <audio id="bgMusic" src="music.mp3" autoplay loop controls></audio>
    </div>

    <script>
        const canvas = document.getElementById('snowCanvas');
        const ctx = canvas.getContext('2d');

        // Ajustar o tamanho do canvas para a tela toda
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Configuração dos flocos de neve
        const snowflakes = [];
        const maxSnowflakes = 120;

        for (let i = 0; i < maxSnowflakes; i++) {
            snowflakes.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 3 + 1,
                speed: Math.random() * 1.5 + 0.5,
                wind: Math.random() * 0.5 - 0.25,
                opacity: Math.random() * 0.7 + 0.3
            });
        }

        // Função para desenhar e animar a neve
        function drawSnow() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';

            for (let flake of snowflakes) {
                ctx.globalAlpha = flake.opacity;
                ctx.beginPath();
                ctx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2, true);
                ctx.fill();

                // Atualizar posição
                flake.y += flake.speed;
                flake.x += flake.wind;

                // Reposicionar o floco se sair da tela
                if (flake.y > canvas.height) {
                    flake.y = -10;
                    flake.x = Math.random() * canvas.width;
                }

                if (flake.x > canvas.width || flake.x < 0) {
                    flake.x = Math.random() * canvas.width;
                }
            }

            requestAnimationFrame(drawSnow);
        }

        drawSnow();
    </script>
</body>
</html>
