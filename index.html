<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural de Contas</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cardBg: '#111214',
                        cardBorder: '#1f2023',
                        discordGreen: '#23a55a',
                        discordBlurple: '#5865F2'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-black text-white min-h-screen font-sans antialiased">

    <main class="max-w-4xl mx-auto px-4 py-12">
        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-10">
            <div>
                <h1 class="text-3xl font-bold tracking-tight mb-1">Mural de Contas</h1>
                <p class="text-zinc-400 text-sm">Contas verificadas via Discord.</p>
            </div>
            <button onclick="window.loginWithDiscord()" class="bg-discordBlurple hover:bg-indigo-600 text-white px-4 py-2.5 rounded-xl font-medium text-sm transition-all shadow-lg flex items-center gap-2 cursor-pointer">
                <i class="fa-brands fa-discord text-lg"></i> Verificar com Discord
            </button>
        </div>

        <div id="accountsGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <p class="text-zinc-500 col-span-2 text-center py-8">Carregando mural...</p>
        </div>
    </main>

    <script>
        // Insira sua chave anônima pública do Supabase abaixo:
        const SUPABASE_URL = 'https://wujmkknhhakumzunpxbb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_A5d5aQYNLel7HySmJ4yzPA_i7SyeYjD'; 
        
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.loginWithDiscord = async function() {
            const { error } = await db.auth.signInWithOAuth({
                provider: 'discord',
                options: {
                    redirectTo: window.location.origin
                }
            });
            if (error) {
                alert('Erro ao iniciar login: ' + error.message);
            }
        };

        async function handleAuthCallback() {
            if (window.location.search.includes('error=')) {
                window.history.replaceState({}, document.title, window.location.pathname);
                return;
            }

            const { data: { session }, error } = await db.auth.getSession();
            
            if (error || !session || !session.user) return;

            const user = session.user;
            const discordData = user.user_metadata || {};

            const discordId = user.id;
            
            // Correção da extração: Pega o Display Name real (global_name) e o username técnico
            const displayName = discordData.custom_claim?.global_name || discordData.global_name || discordData.name || discordData.full_name || 'Usuário';
            const username = discordData.preferred_username || discordData.custom_claim?.username || discordData.user_name || discordData.name || 'discord_user';
            const avatar = discordData.avatar_url || discordData.picture || 'https://cdn.discordapp.com/embed/avatars/0.png';
            
            const flags = discordData.public_flags || discordData.flags || 0;

            await db.from('verified_accounts').upsert({
                discord_id: discordId,
                display_name: displayName,
                username: username,
                avatar: avatar,
                status_message: String(flags)
            }, { onConflict: 'discord_id' });

            window.history.replaceState({}, document.title, window.location.pathname);
        }

        // Função para gerar os emblemas reais do Discord com base nas flags
        function getDiscordBadges(flags) {
            const numFlags = Number(flags) || 0;
            let badgesHtml = '';
            
            const DiscordFlags = {
                Staff: 1 << 0,
                Partner: 1 << 1,
                HypeSquadOnlineHouse1: 1 << 6, // Bravery
                HypeSquadOnlineHouse2: 1 << 7, // Brilliance
                HypeSquadOnlineHouse3: 1 << 8, // Balance
                EarlySupporter: 1 << 9,
                ActiveDeveloper: 1 << 22
            };

            if (numFlags & DiscordFlags.Staff) badgesHtml += '<i class="fa-solid fa-shield-halved text-amber-500" title="Discord Staff"></i>';
            if (numFlags & DiscordFlags.Partner) badgesHtml += '<i class="fa-solid fa-handshake text-indigo-400" title="Discord Partner"></i>';
            if (numFlags & DiscordFlags.HypeSquadOnlineHouse1) badgesHtml += '<i class="fa-solid fa-house-chimney text-red-400" title="HypeSquad Bravery"></i>';
            if (numFlags & DiscordFlags.HypeSquadOnlineHouse2) badgesHtml += '<i class="fa-solid fa-house-chimney text-purple-400" title="HypeSquad Brilliance"></i>';
            if (numFlags & DiscordFlags.HypeSquadOnlineHouse3) badgesHtml += '<i class="fa-solid fa-house-chimney text-green-400" title="HypeSquad Balance"></i>';
            if (numFlags & DiscordFlags.EarlySupporter) badgesHtml += '<i class="fa-solid fa-gem text-amber-400" title="Early Supporter"></i>';
            if (numFlags & DiscordFlags.ActiveDeveloper) badgesHtml += '<i class="fa-solid fa-code text-zinc-300" title="Active Developer"></i>';

            // Badge padrão caso nenhuma específica seja acionada (exibe a badge verde igual ao seu print)
            if (!badgesHtml) {
                badgesHtml = '<i class="fa-solid fa-bolt text-green-400" title="Verificado"></i>';
            }

            return badgesHtml;
        }

        async function loadAccounts() {
            const grid = document.getElementById('accountsGrid');

            const { data: accounts, error } = await db
                .from('verified_accounts')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                grid.innerHTML = `<p class="text-red-500 col-span-2 text-center py-4">Erro ao carregar contas: ${error.message}</p>`;
                return;
            }

            grid.innerHTML = '';
            
            if (!accounts || accounts.length === 0) {
                grid.innerHTML = '<p class="text-zinc-500 col-span-2 text-center py-8">Nenhuma conta verificada ainda.</p>';
                return;
            }

            accounts.forEach(acc => {
                const card = document.createElement('div');
                card.className = "bg-cardBg border border-cardBorder rounded-xl p-4 flex items-center gap-4 relative shadow-lg hover:border-zinc-700 transition-all";
                
                const realBadges = getDiscordBadges(acc.status_message);

                card.innerHTML = `
                    <div class="relative shrink-0">
                        <img src="${acc.avatar}" alt="${acc.display_name}" class="w-16 h-16 rounded-full object-cover ring-2 ring-zinc-800">
                        <div class="absolute bottom-0 right-0 w-4 h-4 bg-discordGreen rounded-full border-2 border-cardBg"></div>
                    </div>
                    <div class="flex-1 min-w-0">
                        <!-- Linha Superior: Display Name + Ícones de Status -->
                        <div class="flex items-center gap-2 flex-wrap mb-1">
                            <span class="font-bold text-white text-base truncate">${acc.display_name}</span>
                            <i class="fa-solid fa-globe text-zinc-400 text-xs" title="Perfil Público"></i>
                            <i class="fa-solid fa-desktop text-discordGreen text-xs" title="Conectado via Desktop"></i>
                        </div>
                        
                        <!-- Linha Inferior: Username exato (@october8888) + Badges Reais -->
                        <div class="flex items-center justify-between">
                            <span class="text-zinc-400 text-xs tracking-wide">@${acc.username}</span>
                            <div class="flex items-center gap-1.5 px-2 py-1 rounded bg-zinc-900 border border-zinc-800 text-xs shadow-inner">
                                ${realBadges}
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await handleAuthCallback();
            await loadAccounts();
        });
    </script>
</body>
</html>
