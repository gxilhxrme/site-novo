<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 1337 </title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome 6 icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        pureBlack: '#000000',
                        cardBg: '#0b0b0e',
                        cardBorder: '#16171a',
                        bubbleBg: '#232428',
                        badgePill: '#111214',
                        discordGreen: '#23a55a',
                        discordSubtext: '#949ba4'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #000000;
            color: #f2f3f5;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #000000;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e1f22;
            border-radius: 3px;
        }

        /* Card Animation */
        .card-enter {
            animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.95) translateY(8px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
    </style>
</head>
<body class="bg-pureBlack text-white min-h-screen flex flex-col font-sans antialiased selection:bg-[#5865f2] selection:text-white">

    <!-- CABEÇALHO ultra minimalista -->
    <header class="py-6 px-4 border-b border-[#121316]">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <i class="fa-brands fa-discord text-2xl text-[#5865f2]"></i>
                <h1 class="font-extrabold text-sm sm:text-base tracking-tight text-white flex items-center gap-2">
                    Mural de Contas <span class="bg-[#23a55a]/10 text-[#23a55a] text-[10px] font-bold px-2 py-0.5 rounded-full border border-[#23a55a]/30">2x2</span>
                </h1>
            </div>

            <!-- Botão de Verificação Rápida -->
            <button onclick="openModal()" class="bg-[#5865f2] hover:bg-[#4752c4] text-white font-bold text-xs px-3.5 py-2 rounded-xl transition flex items-center gap-2 shadow-lg shadow-[#5865f2]/20 active:scale-95">
                <i class="fa-solid fa-shield-halved text-xs"></i>
                <span>Verificar Conta</span>
            </button>
        </div>
    </header>

    <!-- MURAL COM GRADE DE EXATAMENTE 2 COLUNAS (grid-cols-2) -->
    <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full">
        <!-- Rigid 2-Column Grid -->
        <div id="cardsGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4 items-start">
            <!-- Cards inseridos dinamicamente via JS -->
        </div>
    </main>

    <!-- MODAL DE NOVA ADIÇÃO -->
    <div id="addModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden items-center justify-center p-4">
        <div class="bg-cardBg border border-cardBorder w-full max-w-sm rounded-2xl p-5 shadow-2xl relative card-enter">
            <div class="flex items-center justify-between pb-3 border-b border-cardBorder mb-4">
                <h3 class="font-bold text-sm text-white flex items-center gap-2">
                    <i class="fa-brands fa-discord text-[#5865f2]"></i>
                    Adicionar Conta ao Mural
                </h3>
                <button onclick="closeModal()" class="text-discordSubtext hover:text-white text-sm">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form onsubmit="handleFormSubmit(event)" class="space-y-3">
                <div>
                    <label class="text-[10px] font-bold uppercase text-discordSubtext">Nome de Exibição</label>
                    <input type="text" id="inputDisplay" required placeholder="gui" class="w-full bg-pureBlack border border-cardBorder text-xs text-white p-2.5 rounded-xl mt-1 focus:outline-none focus:border-[#5865f2]">
                </div>

                <div>
                    <label class="text-[10px] font-bold uppercase text-discordSubtext">Username (@)</label>
                    <input type="text" id="inputUsername" required placeholder="october88888" class="w-full bg-pureBlack border border-cardBorder text-xs text-white p-2.5 rounded-xl mt-1 focus:outline-none focus:border-[#5865f2]">
                </div>

                <div>
                    <label class="text-[10px] font-bold uppercase text-discordSubtext">Status / Pensamento Customizado</label>
                    <input type="text" id="inputStatusText" placeholder="+ NPC favorito?" class="w-full bg-pureBlack border border-cardBorder text-xs text-white p-2.5 rounded-xl mt-1 focus:outline-none focus:border-[#5865f2]">
                </div>

                <div>
                    <label class="text-[10px] font-bold uppercase text-discordSubtext">Avatar URL (Opcional)</label>
                    <input type="url" id="inputAvatar" placeholder="https://..." class="w-full bg-pureBlack border border-cardBorder text-xs text-white p-2.5 rounded-xl mt-1 focus:outline-none focus:border-[#5865f2]">
                </div>

                <div class="flex justify-between items-center pt-2">
                    <button type="button" onclick="closeModal()" class="text-xs font-semibold text-discordSubtext hover:text-white px-3 py-2">Cancelar</button>
                    <button type="submit" class="bg-[#5865f2] hover:bg-[#4752c4] text-white font-bold text-xs px-4 py-2 rounded-xl shadow-md transition">
                        Adicionar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- BOTÃO FLUTUANTE DE VERIFICAÇÃO RÁPIDA NO CANTO DA TELA -->
    <div class="fixed bottom-5 right-5 z-40">
        <button onclick="simulateQuickAdd()" title="Adicionar conta teste instantânea" class="w-12 h-12 rounded-full bg-cardBg border border-cardBorder hover:border-[#23a55a] text-[#23a55a] flex items-center justify-center shadow-2xl transition active:scale-95 group">
            <i class="fa-solid fa-plus text-base group-hover:rotate-90 transition-transform"></i>
        </button>
    </div>

    <!-- NOTIFICAÇÕES FLOATING TOAST -->
    <div id="toastContainer" class="fixed bottom-5 left-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- JAVASCRIPT -->
    <script>
        // Dados iniciais com a conta fiel da imagem (gui / october88888)
        const defaultAccounts = [
            {
                id: "1",
                displayName: "gui",
                username: "october88888",
                statusText: "+ NPC favorito?",
                deviceOnline: true,
                avatar: "",
                badges: ["booster_green"]
            },
            {
                id: "2",
                displayName: "zack",
                username: "zack.vfx",
                statusText: "solitude 🎧",
                deviceOnline: true,
                avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=120&q=80",
                badges: ["nitro", "hypesquad"]
            },
            {
                id: "3",
                displayName: "maya",
                username: "mayadev",
                statusText: "coding ⚡",
                deviceOnline: true,
                avatar: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=120&q=80",
                badges: ["active_dev"]
            },
            {
                id: "4",
                displayName: "dante",
                username: "dantex9",
                statusText: "afk / 🛌",
                deviceOnline: false,
                avatar: "https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?auto=format&fit=crop&w=120&q=80",
                badges: ["booster_green", "nitro"]
            }
        ];

        let accounts = [];

        window.onload = function() {
            loadAccounts();
            renderGrid();
        };

        function loadAccounts() {
            const saved = localStorage.getItem('discord_wall_minimal_2col');
            if (saved) {
                try {
                    accounts = JSON.parse(saved);
                } catch(e) {
                    accounts = [...defaultAccounts];
                }
            } else {
                accounts = [...defaultAccounts];
                saveAccounts();
            }
        }

        function saveAccounts() {
            localStorage.setItem('discord_wall_minimal_2col', JSON.stringify(accounts));
        }

        function renderGrid() {
            const container = document.getElementById('cardsGrid');
            
            container.innerHTML = accounts.map(acc => {
                const avatarSrc = acc.avatar || "https://cdn.discordapp.com/embed/avatars/0.png";
                
                // Trata as badges no pill escuro do Discord
                let badgesMarkup = '';
                if (acc.badges.includes('booster_green')) {
                    badgesMarkup += `
                        <span class="w-4 h-4 rounded-full bg-[#23a55a] flex items-center justify-center text-[8px] text-black font-extrabold" title="Verified Badge">
                            <i class="fa-solid fa-bolt"></i>
                        </span>`;
                }
                if (acc.badges.includes('nitro')) {
                    badgesMarkup += `
                        <i class="fa-solid fa-bolt text-[#f47fff] text-xs" title="Nitro"></i>`;
                }
                if (acc.badges.includes('hypesquad')) {
                    badgesMarkup += `
                        <i class="fa-solid fa-shield-halved text-[#9b59b6] text-xs" title="HypeSquad"></i>`;
                }
                if (acc.badges.includes('active_dev')) {
                    badgesMarkup += `
                        <i class="fa-solid fa-code text-cyan-400 text-xs" title="Active Developer"></i>`;
                }

                return `
                <!-- CARD INDIVIDUAL EXATAMENTE IGUAL À IMAGEM -->
                <div class="card-enter bg-cardBg border border-cardBorder rounded-2xl p-4 flex flex-col relative overflow-visible shadow-xl hover:border-[#202226] transition duration-200">
                    
                    <!-- Botão discreto para remover ao passar o mouse -->
                    <button onclick="removeAccount('${acc.id}')" title="Remover" class="absolute top-3 right-3 text-discordSubtext/40 hover:text-red-400 text-xs transition">
                        <i class="fa-solid fa-xmark"></i>
                    </button>

                    <!-- SEÇÃO AVATAR + BALÃO DE PENSAMENTO -->
                    <div class="flex items-center gap-3 relative">
                        
                        <!-- AVATAR COM DISCORD GREEN STATUS CUTOUT -->
                        <div class="relative shrink-0">
                            <div class="w-16 h-16 rounded-full bg-[#5865f2] flex items-center justify-center overflow-hidden shadow-lg border border-white/5">
                                <img src="${avatarSrc}" alt="${acc.displayName}" class="w-full h-full object-cover" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
                            </div>
                            <!-- Ponto de status online verde com cutout preta do fundo do card -->
                            <span class="absolute bottom-0 right-0 w-4.5 h-4.5 rounded-full bg-discordGreen ring-4 ring-cardBg"></span>
                        </div>

                        <!-- BALÃO DE STATUS ESTILO DISCORD (com as 2 bolinhas de pensamento) -->
                        <div class="relative flex items-center">
                            <!-- Bolinhas de Pensamento conectando ao avatar -->
                            <div class="absolute -left-3 top-1/2 -translate-y-1/2 flex items-center gap-0.5 pointer-events-none">
                                <span class="w-1.5 h-1.5 rounded-full bg-bubbleBg"></span>
                                <span class="w-2.5 h-2.5 rounded-full bg-bubbleBg -ml-0.5"></span>
                            </div>

                            <!-- Pílula de texto do Status -->
                            <div class="bg-bubbleBg border border-[#313338]/30 px-3 py-1.5 rounded-2xl text-xs text-[#dbdee1] flex items-center gap-1.5 shadow-md">
                                <i class="fa-solid fa-plus text-[10px] text-discordSubtext"></i>
                                <span class="italic font-medium text-[11px] tracking-tight">${escapeHtml(acc.statusText || 'NPC favorito?')}</span>
                            </div>
                        </div>
                    </div>

                    <!-- DETALHES ABAIXO DO AVATAR -->
                    <div class="mt-3.5 space-y-0.5">
                        
                        <!-- NOME DE EXIBIÇÃO (gui) + ÍCONE DE MONITOR VERDE -->
                        <div class="flex items-center gap-1.5">
                            <span class="text-white font-extrabold text-base tracking-tight">${escapeHtml(acc.displayName)}</span>
                            ${acc.deviceOnline ? `
                                <span class="text-discordGreen text-xs" title="Online no Desktop">
                                    <i class="fa-solid fa-desktop"></i>
                                </span>
                            ` : ''}
                        </div>

                        <!-- USERNAME (@october88888) + PÍLULA DE BADGES -->
                        <div class="flex items-center gap-2">
                            <span class="text-discordSubtext text-xs font-medium tracking-tight">${escapeHtml(acc.username)}</span>
                            
                            <!-- Badges capsule -->
                            ${badgesMarkup ? `
                                <div class="bg-badgePill border border-[#1e1f22] px-1.5 py-0.5 rounded-full flex items-center gap-1">
                                    ${badgesMarkup}
                                </div>
                            ` : ''}
                        </div>

                    </div>
                </div>
                `;
            }).join('');
        }

        // Funções do Modal
        function openModal() {
            document.getElementById('addModal').classList.remove('hidden');
            document.getElementById('addModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('addModal').classList.add('hidden');
            document.getElementById('addModal').classList.remove('flex');
        }

        function handleFormSubmit(e) {
            e.preventDefault();

            const displayName = document.getElementById('inputDisplay').value.trim();
            const username = document.getElementById('inputUsername').value.trim().replace(/^@/, '');
            const statusText = document.getElementById('inputStatusText').value.trim() || 'NPC favorito?';
            const avatar = document.getElementById('inputAvatar').value.trim();

            const newAcc = {
                id: Date.now().toString(),
                displayName: displayName,
                username: username,
                statusText: statusText,
                deviceOnline: true,
                avatar: avatar,
                badges: ['booster_green']
            };

            accounts.unshift(newAcc);
            saveAccounts();
            renderGrid();
            closeModal();
            showToast(`Conta <strong>${displayName}</strong> verificada!`);

            document.getElementById('inputDisplay').value = '';
            document.getElementById('inputUsername').value = '';
            document.getElementById('inputStatusText').value = '';
            document.getElementById('inputAvatar').value = '';
        }

        function simulateQuickAdd() {
            const samples = [
                { display: "koda", user: "koda_99", status: "jogando valorant 🎮", badges: ["booster_green", "nitro"] },
                { display: "clara", user: "clara.tsx", status: "afk almoço 🍜", badges: ["active_dev"] },
                { display: "felix", user: "felix_dev", status: "+ qual seu main?", badges: ["booster_green"] }
            ];
            
            const item = samples[Math.floor(Math.random() * samples.length)];

            const newAcc = {
                id: Date.now().toString(),
                displayName: item.display,
                username: item.user,
                statusText: item.status,
                deviceOnline: true,
                avatar: "",
                badges: item.badges
            };

            accounts.unshift(newAcc);
            saveAccounts();
            renderGrid();
            showToast(`Conta <strong>${item.display}</strong> verificada!`);
        }

        function removeAccount(id) {
            accounts = accounts.filter(a => a.id !== id);
            saveAccounts();
            renderGrid();
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function showToast(msg) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'bg-cardBg border border-cardBorder text-white px-3.5 py-2 rounded-xl text-xs flex items-center gap-2 shadow-2xl card-enter pointer-events-auto';
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-discordGreen"></i> <span>${msg}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'all 0.2s ease';
                setTimeout(() => toast.remove(), 200);
            }, 2500);
        }
    </script>
</body>
</html>
