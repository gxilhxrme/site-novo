<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural de Contas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cardBg: '#111214',
                        cardBorder: '#1f2023',
                        discordGreen: '#23a55a',
                        discordBlurple: '#5865F2'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-black text-white min-h-screen font-sans antialiased">

    <main class="max-w-4xl mx-auto px-4 py-12">
        <div class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-3xl font-bold tracking-tight mb-1">Mural de Contas</h1>
                <p class="text-zinc-400 text-sm">Contas verificadas via Discord.</p>
            </div>
            <button onclick="loginWithDiscord()" class="bg-discordBlurple hover:bg-indigo-600 text-white px-4 py-2 rounded-lg font-medium text-sm transition flex items-center gap-2">
                <i class="fa-brands fa-discord"></i> Verificar com Discord
            </button>
        </div>

        <!-- Grade de 2 Colunas -->
        <div id="accountsGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- Cards injetados via JS -->
        </div>
    </main>

    <script>
        // Substitua pelas suas credenciais do Supabase
        const SUPABASE_URL = 'SUA_SUPABASE_URL';
        const SUPABASE_ANON_KEY = ' SUA_SUPABASE_ANON_KEY';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function loginWithDiscord() {
    const { error } = await supabase.auth.signInWithOAuth({
        provider: 'discord',
        options: {
            // window.location.origin pega automaticamente a URL da Vercel ou seu domínio próprio
            redirectTo: window.location.origin
        }
    });
    if (error) alert('Erro ao entrar: ' + error.message);
}

        async function handleAuthCallback() {
            // Verifica se o usuário acabou de voltar do login do Discord
            const { data: { session } } = await supabase.auth.getSession();
            if (session && session.user) {
                const user = session.user;
                const discordData = user.user_metadata;

                // Dados do usuário obtidos do Discord OAuth
                const discordId = user.id;
                const displayName = discordData.full_name || discordData.name || 'Usuário';
                const username = discordData.preferred_username || discordData.custom_claim?.global_name || 'discord_user';
                const avatar = discordData.avatar_url || 'https://cdn.discordapp.com/embed/avatars/0.png';

                // Salva ou atualiza no banco de dados do Supabase
                await supabase.from('verified_accounts').upsert({
                    discord_id: discordId,
                    display_name: displayName,
                    username: username,
                    avatar: avatar
                }, { onConflict: 'discord_id' });

                // Limpa a URL para remover os parâmetros de auth
                window.history.replaceState({}, document.title, window.location.pathname);
                loadAccounts();
            }
        }

        async function loadAccounts() {
            const grid = document.getElementById('accountsGrid');
            grid.innerHTML = '<p class="text-zinc-500 col-span-2 text-center py-4">Carregando mural...</p>';

            const { data: accounts, error } = await supabase
                .from('verified_accounts')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                grid.innerHTML = '<p class="text-red-500 col-span-2 text-center">Erro ao carregar contas.</p>';
                return;
            }

            grid.innerHTML = '';
            if (accounts.length === 0) {
                grid.innerHTML = '<p class="text-zinc-500 col-span-2 text-center py-4">Nenhuma conta verificada ainda.</p>';
                return;
            }

            accounts.forEach(acc => {
                const card = document.createElement('div');
                card.className = "bg-cardBg border border-cardBorder rounded-xl p-4 flex items-center gap-4 relative shadow-lg hover:border-zinc-700 transition-all";
                
                card.innerHTML = `
                    <div class="relative shrink-0">
                        <img src="${acc.avatar}" alt="${acc.display_name}" class="w-16 h-16 rounded-full object-cover ring-2 ring-zinc-800">
                        <div class="absolute bottom-0 right-0 w-4 h-4 bg-discordGreen rounded-full border-2 border-cardBg"></div>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 flex-wrap mb-1">
                            <span class="font-bold text-white text-base truncate">${acc.display_name}</span>
                            <i class="fa-solid fa-desktop text-discordGreen text-xs" title="Conectado via Desktop"></i>
                            <div class="relative ml-auto sm:ml-2 bg-[#232428] text-zinc-200 text-xs px-3 py-1.5 rounded-lg border border-zinc-700/50 shadow-sm flex items-center gap-1.5 shrink-0">
                                <span class="text-zinc-400">+</span>
                                <span class="italic font-medium">${acc.status_message}</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-zinc-400 text-xs tracking-wide">@${acc.username}</span>
                            <div class="inline-flex items-center justify-center px-1.5 py-0.5 rounded bg-zinc-900 text-green-400 border border-zinc-800 text-xs shadow-inner">
                                <i class="fa-solid fa-bolt text-[10px]"></i>
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await handleAuthCallback();
            loadAccounts();
        });
    </script>
</body>
</html>
