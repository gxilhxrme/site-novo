<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural de Contas</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cardBg: '#111214',
                        cardBorder: '#1f2023',
                        discordGreen: '#23a55a',
                        discordBlurple: '#5865F2'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-black text-white min-h-screen font-sans antialiased">

    <main class="max-w-4xl mx-auto px-4 py-12">
        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-10">
            <div>
                <h1 class="text-3xl font-bold tracking-tight mb-1">Mural de Contas</h1>
                <p class="text-zinc-400 text-sm">Contas verificadas via Discord.</p>
            </div>
            <div class="flex items-center gap-3">
                <!-- Botão de gerenciar badges (aparece para o usuário logado) -->
                <button id="configBtn" onclick="openBadgeModal()" class="hidden bg-zinc-800 hover:bg-zinc-700 text-zinc-200 px-3 py-2.5 rounded-xl font-medium text-sm transition-all shadow-lg items-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-gear"></i> Escolher Badges
                </button>
                <button id="loginBtn" onclick="window.loginWithDiscord()" class="bg-discordBlurple hover:bg-indigo-600 text-white px-4 py-2.5 rounded-xl font-medium text-sm transition-all shadow-lg flex items-center gap-2 cursor-pointer">
                    <i class="fa-brands fa-discord text-lg"></i> Verificar com Discord
                </button>
            </div>
        </div>

        <div id="accountsGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <p class="text-zinc-500 col-span-2 text-center py-8">Carregando mural...</p>
        </div>
    </main>

    <!-- Modal para escolher badges -->
    <div id="badgeModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-cardBg border border-cardBorder rounded-2xl p-6 max-w-md w-full shadow-2xl">
            <h3 class="text-lg font-bold mb-3 text-white">Selecione sua Badge do Discord</h3>
            <p class="text-zinc-400 text-xs mb-4">Escolha qual insígnia oficial aparecerá no seu card:</p>
            
            <div class="grid grid-cols-2 gap-2 mb-6">
                <label class="flex items-center gap-3 p-3 rounded-xl bg-zinc-900 border border-zinc-800 cursor-pointer hover:border-discordBlurple transition-all">
                    <input type="radio" name="badgeSelect" value="active_developer.png" class="accent-indigo-500">
                    <span class="text-sm font-medium flex items-center gap-2"><img src="badges/active_developer.png" class="w-4 h-4 object-contain"> Active Developer</span>
                </label>
                <label class="flex items-center gap-3 p-3 rounded-xl bg-zinc-900 border border-zinc-800 cursor-pointer hover:border-discordBlurple transition-all">
                    <input type="radio" name="badgeSelect" value="early_supporter.png" class="accent-indigo-500">
                    <span class="text-sm font-medium flex items-center gap-2"><img src="badges/early_supporter.png" class="w-4 h-4 object-contain"> Early Supporter</span>
                </label>
                <label class="flex items-center gap-3 p-3 rounded-xl bg-zinc-900 border border-zinc-800 cursor-pointer hover:border-discordBlurple transition-all">
                    <input type="radio" name="badgeSelect" value="hypesquad_bravery.png" class="accent-indigo-500">
                    <span class="text-sm font-medium flex items-center gap-2"><img src="badges/hypesquad_bravery.png" class="w-4 h-4 object-contain"> Bravery</span>
                </label>
                <label class="flex items-center gap-3 p-3 rounded-xl bg-zinc-900 border border-zinc-800 cursor-pointer hover:border-discordBlurple transition-all">
                    <input type="radio" name="badgeSelect" value="hypesquad_brilliance.png" class="accent-indigo-500">
                    <span class="text-sm font-medium flex items-center gap-2"><img src="badges/hypesquad_brilliance.png" class="w-4 h-4 object-contain"> Brilliance</span>
                </label>
                <label class="flex items-center gap-3 p-3 rounded-xl bg-zinc-900 border border-zinc-800 cursor-pointer hover:border-discordBlurple transition-all">
                    <input type="radio" name="badgeSelect" value="hypesquad_balance.png" class="accent-indigo-500">
                    <span class="text-sm font-medium flex items-center gap-2"><img src="badges/hypesquad_balance.png" class="w-4 h-4 object-contain"> Balance</span>
                </label>
                <label class="flex items-center gap-3 p-3 rounded-xl bg-zinc-900 border border-zinc-800 cursor-pointer hover:border-discordBlurple transition-all">
                    <input type="radio" name="badgeSelect" value="discord_staff.png" class="accent-indigo-500">
                    <span class="text-sm font-medium flex items-center gap-2"><img src="badges/discord_staff.png" class="w-4 h-4 object-contain"> Discord Staff</span>
                </label>
            </div>

            <div class="flex justify-end gap-3">
                <button onclick="closeBadgeModal()" class="px-4 py-2 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-sm font-medium transition-all cursor-pointer">Cancelar</button>
                <button onclick="saveSelectedBadge()" class="px-4 py-2 rounded-xl bg-discordBlurple hover:bg-indigo-600 text-sm font-medium transition-all cursor-pointer">Salvar no Supabase</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://wujmkknhhakumzunpxbb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_A5d5aQYNLel7HySmJ4yzPA_i7SyeYjD'; 
        
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUserDiscordId = null;

        window.loginWithDiscord = async function() {
            const { error } = await db.auth.signInWithOAuth({
                provider: 'discord',
                options: {
                    redirectTo: window.location.origin
                }
            });
            if (error) {
                alert('Erro ao iniciar login: ' + error.message);
            }
        };

        async function handleAuthCallback() {
            if (window.location.search.includes('error=')) {
                window.history.replaceState({}, document.title, window.location.pathname);
                return;
            }

            const { data: { session }, error } = await db.auth.getSession();
            
            if (error || !session || !session.user) return;

            const user = session.user;
            currentUserDiscordId = user.id;

            const discordData = user.user_metadata || {};
            const customClaims = discordData.custom_claims || discordData.custom_claim || {};

            const displayName = customClaims.global_name || discordData.global_name || discordData.name || 'Usuário';
            const username = discordData.full_name || discordData.preferred_username || 'discord_user';
            const avatar = discordData.avatar_url || discordData.picture || 'https://cdn.discordapp.com/embed/avatars/0.png';

            // Verifica se o usuário já existe para manter a badge escolhida anteriormente
            const { data: existing } = await db.from('verified_accounts').select('status_message').eq('discord_id', currentUserDiscordId).single();
            const currentBadge = existing?.status_message || 'active_developer.png';

            await db.from('verified_accounts').upsert({
                discord_id: currentUserDiscordId,
                display_name: displayName,
                username: username,
                avatar: avatar,
                status_message: currentBadge
            }, { onConflict: 'discord_id' });

            document.getElementById('configBtn').classList.remove('hidden');
            document.getElementById('configBtn').classList.add('flex');

            window.history.replaceState({}, document.title, window.location.pathname);
        }

        window.openBadgeModal = function() {
            document.getElementById('badgeModal').classList.remove('hidden');
            document.getElementById('badgeModal').classList.add('flex');
        }

        window.closeBadgeModal = function() {
            document.getElementById('badgeModal').classList.add('hidden');
            document.getElementById('badgeModal').classList.remove('flex');
        }

        window.saveSelectedBadge = async function() {
            const selected = document.querySelector('input[name="badgeSelect"]:checked');
            if (!selected || !currentUserDiscordId) {
                alert('Selecione uma badge primeiro!');
                return;
            }

            const badgeFile = selected.value;

            // Atualiza diretamente na coluna status_message da tabela verified_accounts no Supabase
            const { error } = await db.from('verified_accounts')
                .update({ status_message: badgeFile })
                .eq('discord_id', currentUserDiscordId);

            if (error) {
                alert('Erro ao atualizar badge no Supabase: ' + error.message);
                return;
            }

            closeBadgeModal();
            loadAccounts();
        }

        async function loadAccounts() {
            const grid = document.getElementById('accountsGrid');

            const { data: accounts, error } = await db
                .from('verified_accounts')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                grid.innerHTML = `<p class="text-red-500 col-span-2 text-center py-4">Erro ao carregar contas: ${error.message}</p>`;
                return;
            }

            grid.innerHTML = '';
            
            if (!accounts || accounts.length === 0) {
                grid.innerHTML = '<p class="text-zinc-500 col-span-2 text-center py-8">Nenhuma conta verificada ainda.</p>';
                return;
            }

            const { data: { session } } = await db.auth.getSession();
            if (session && session.user) {
                currentUserDiscordId = session.user.id;
                document.getElementById('configBtn').classList.remove('hidden');
                document.getElementById('configBtn').classList.add('flex');
            }

            accounts.forEach(acc => {
                const card = document.createElement('div');
                card.className = "bg-cardBg border border-cardBorder rounded-xl p-4 flex items-center gap-4 relative shadow-lg hover:border-zinc-700 transition-all";
                
                // Puxa diretamente o arquivo salvo no Supabase
                const badgeImg = acc.status_message ? `badges/${acc.status_message}` : 'badges/active_developer.png';

                card.innerHTML = `
                    <div class="relative shrink-0">
                        <img src="${acc.avatar}" alt="${acc.display_name}" class="w-16 h-16 rounded-full object-cover ring-2 ring-zinc-800">
                        <div class="absolute bottom-0 right-0 w-4 h-4 bg-discordGreen rounded-full border-2 border-cardBg"></div>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 flex-wrap mb-1">
                            <span class="font-bold text-white text-base truncate">${acc.display_name}</span>
                            <i class="fa-solid fa-globe text-zinc-400 text-xs" title="Perfil Público"></i>
                            <i class="fa-solid fa-desktop text-discordGreen text-xs" title="Conectado via Desktop"></i>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-zinc-400 text-xs tracking-wide">@${acc.username}</span>
                            <div class="flex items-center gap-1.5 px-2 py-1 rounded bg-zinc-900 border border-zinc-800 shadow-inner">
                                <img src="${badgeImg}" class="w-5 h-5 object-contain" alt="Badge" onerror="this.src='badges/active_developer.png'">
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await handleAuthCallback();
            await loadAccounts();
        });
    </script>
</body>
</html>
