<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Efeito de Neve com Música</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }

        /* Canvas da neve cobrindo toda a tela */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Container principal centralizado e adaptável */
        .couple-container {
            position: relative;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 500px;
            padding: 0 10px;
        }

        /* Ajuste responsivo dos bonecos para celular */
        .character {
            width: 40vw;
            max-width: 200px;
            height: auto;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.25));
            flex-shrink: 0;
        }

        /* Container flexível da linha curvada */
        .connection-wrapper {
            position: relative;
            width: 25vw;
            max-width: 140px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 -15px; /* Sobrepõe levemente para apontar bem nos dois */
        }

        /* SVG da linha pontilhada curvada ligando os dois */
        .curved-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .curved-line {
            fill: none;
            stroke: #ffffff;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-dasharray: 6 4; /* Efeito pontilhado refinado */
            filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.8));
        }

        /* Coração branco flutuante no topo da curva */
        .heart {
            position: absolute;
            top: -5px;
            z-index: 2;
            color: #ffffff;
            font-size: 22px;
            background-color: #000000;
            padding: 0 6px;
            border-radius: 50%;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.9);
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.3);
            }
        }

        /* Player de áudio adaptado para telas mobile */
        .audio-container {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            opacity: 0.85;
            transition: opacity 0.3s ease;
        }

        .audio-container:hover {
            opacity: 1;
        }

        audio {
            height: 35px;
            width: 260px;
            max-width: 85vw;
        }
    </style>
</head>
<body>

    <!-- Fundo de neve -->
    <canvas id="snowCanvas"></canvas>

    <!-- Estrutura central para celulares -->
    <div class="couple-container">
        <!-- Garoto -->
        <img src="boy.png" alt="Personagem Masculino" class="character">
        
        <!-- Linha de conexão curvada indicando ambos -->
        <div class="connection-wrapper">
            <svg class="curved-svg" viewBox="0 0 140 70">
                <!-- Arco curvado apontando de um boneco para o outro -->
                <path d="M 5,55 Q 70,-15 135,55" class="curved-line" />
            </svg>
            <span class="heart">♥</span>
        </div>
        
        <!-- Garota -->
        <img src="girl.png" alt="Personagem Feminino" class="character">
    </div>

    <!-- Player de música centralizado na parte inferior -->
    <div class="audio-container">
        <audio id="bgMusic" src="music.mp3" autoplay loop controls></audio>
    </div>

    <script>
        const canvas = document.getElementById('snowCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Quantidade de neve ajustada para não travar em celulares
        const snowflakes = [];
        const maxSnowflakes = 80;

        for (let i = 0; i < maxSnowflakes; i++) {
            snowflakes.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 3 + 1,
                speed: Math.random() * 1.5 + 0.5,
                wind: Math.random() * 0.5 - 0.25,
                opacity: Math.random() * 0.7 + 0.3
            });
        }

        function drawSnow() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';

            for (let flake of snowflakes) {
                ctx.globalAlpha = flake.opacity;
                ctx.beginPath();
                ctx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2, true);
                ctx.fill();

                flake.y += flake.speed;
                flake.x += flake.wind;

                if (flake.y > canvas.height) {
                    flake.y = -10;
                    flake.x = Math.random() * canvas.width;
                }

                if (flake.x > canvas.width || flake.x < 0) {
                    flake.x = Math.random() * canvas.width;
                }
            }

            requestAnimationFrame(drawSnow);
        }

        drawSnow();
    </script>
</body>
</html>
